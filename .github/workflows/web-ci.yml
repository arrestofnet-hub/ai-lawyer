name: Standalone web checks
on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
  push:
    branches: ["feature/standalone-legal-web-v1"]
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install export libraries
        run: cd web && npm install --omit=dev --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Syntax
        run: cd web && npm run check && node --check deploy/diagnose-openai.mjs
      - name: VPS installer syntax
        run: bash -n web/deploy/install-vps.sh web/deploy/enable-chat-nginx.sh web/deploy/update-pilot.sh web/deploy/configure-auth.sh
      - name: Unit tests
        run: cd web && npm test
