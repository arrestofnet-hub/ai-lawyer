name: MCP smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "server.js"
      - "package.json"
      - "scripts/smoke.mjs"
      - ".github/workflows/smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - name: Wait for deployment and readiness
        shell: bash
        run: |
          set -e
          for i in {1..30}; do
            code=$(curl -sS -o /tmp/ready.json -w "%{http_code}" https://ai-lawyer-kz-v2-production.up.railway.app/ready || true)
            cat /tmp/ready.json || true
            if [ "$code" = "200" ] && grep -q "\"persistent_memory\":\"ok\"" /tmp/ready.json && grep -q "\"version\":\"0.8.0\"" /tmp/ready.json; then exit 0; fi
            sleep 10
          done
          exit 1
      - name: Run MCP smoke test
        run: node scripts/smoke.mjs
