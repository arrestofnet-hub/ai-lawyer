name: MCP smoke test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "server.js"
      - "package.json"
      - "scripts/**"
      - ".github/workflows/smoke.yml"
  push:
    branches: [main]
    paths:
      - "server.js"
      - "package.json"
      - "scripts/**"
      - ".github/workflows/smoke.yml"

permissions:
  contents: read

jobs:
  local-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - name: Test deployment readiness checks
        run: node --test scripts/wait-ready.test.mjs
      - name: Verify public tools against this checkout
        env:
          MCP_URL: http://127.0.0.1:8787/mcp
          PORT: "8787"
          READY_TIMEOUT_MS: "30000"
          READY_INTERVAL_MS: "250"
          RAILWAY_GIT_COMMIT_SHA: ${{ github.sha }}
          EXPECTED_GIT_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          node server.js > /tmp/mcp-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat /tmp/mcp-server.log' EXIT
          node scripts/wait-ready.mjs
          node scripts/smoke.mjs

  smoke:
    if: github.event_name != 'pull_request'
    needs: local-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      MCP_URL: https://mcp.ailawyer.kz/mcp
      EXPECTED_GIT_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - name: Wait for deployment and readiness
        run: node scripts/wait-ready.mjs
      - name: Run MCP smoke test
        run: node scripts/smoke.mjs
