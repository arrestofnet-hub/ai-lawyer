name: Temporary MCP debug

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mcp-debug.yml"

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - name: Test official Kazakhstan sources
        shell: bash
        run: |
          cat > debug.mjs <<'EOF'
          const urls = [
            "https://old.adilet.zan.kz/rus/docs/K1500000377",
            "https://www.adilet.zan.kz/rus/docs/K1500000377",
            "https://adilet.zan.kz/rus/docs/K1500000377",
            "https://zan.gov.kz/api/documents/95109/rus?withHtml=true&page=1"
          ];
          for (const url of urls) {
            try {
              const r = await fetch(url, {
                redirect: "follow",
                headers: {
                  "accept":"text/html,application/json,text/plain,*/*",
                  "user-agent":"Mozilla/5.0 (compatible; AI-Lawyer-KZ/0.7; +legal-research)"
                },
                signal: AbortSignal.timeout(20000)
              });
              const body = await r.text();
              console.log("FETCH", JSON.stringify({
                url,
                finalUrl:r.url,
                status:r.status,
                ok:r.ok,
                contentType:r.headers.get("content-type"),
                length:body.length,
                prefix:body.slice(0,500).replace(/\s+/g," ")
              }));
            } catch(e) {
              console.log("FETCH", JSON.stringify({url,error:String(e),cause:e?.cause ? String(e.cause):null}));
            }
          }
          EOF
          node debug.mjs
