name: Build plugin submission package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "plugin.json"
      - "mcp.json"
      - ".mcp.json"
      - ".codex-plugin/plugin.json"
      - "skills/**"
      - "assets/**"
      - "PRIVACY.md"
      - "TERMS.md"
      - ".github/workflows/package.yml"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build clean submission ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/package/.codex-plugin dist/package/skills/kz-legal dist/package/assets submission
          cp plugin.json mcp.json .mcp.json dist/package/
          cp .codex-plugin/plugin.json dist/package/.codex-plugin/plugin.json
          cp -R skills/kz-legal/. dist/package/skills/kz-legal/
          cp assets/logo.svg assets/composer.svg dist/package/assets/
          cp PRIVACY.md TERMS.md dist/package/
          (
            cd dist/package
            zip -r ../ai-lawyer-plugin-0.9.0.zip .
          )
          unzip -l dist/ai-lawyer-plugin-0.9.0.zip
          if unzip -l dist/ai-lawyer-plugin-0.9.0.zip | grep -E 'server\.js|SUPABASE|\.github|scripts/'; then
            echo "Unexpected runtime/internal files in submission ZIP"
            exit 1
          fi
          cp dist/ai-lawyer-plugin-0.9.0.zip submission/ai-lawyer-plugin-0.9.0.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ai-lawyer-plugin-0.9.0
          path: dist/ai-lawyer-plugin-0.9.0.zip
          if-no-files-found: error
          retention-days: 14
      - name: Publish submission ZIP to repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add submission/ai-lawyer-plugin-0.9.0.zip
          if git diff --cached --quiet; then
            echo "Submission ZIP unchanged"
          else
            git commit -m "Refresh OpenAI plugin submission ZIP"
            git push
          fi
